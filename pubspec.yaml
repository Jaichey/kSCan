    sdk: flutter

  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  flex_color_picker: ^3.5.1
  image_picker: ^1.1.2
  firebase_core: ^3.6.0
  firebase_auth: ^5.5.1
